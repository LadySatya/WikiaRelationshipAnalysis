# Phase 2 RAG Processor Configuration

processor:
  rag:
    # Chunking settings
    chunk_size: 500              # characters per chunk
    chunk_overlap: 50            # overlap between chunks for context

    # Embedding settings
    embedding_provider: "local"  # "local" (sentence-transformers) or "voyage" (Voyage AI)
    local_model: "all-MiniLM-L6-v2"  # Fast, 384 dimensions, good for prototyping
    voyage_model: "voyage-3-lite"  # Fast and cheap embeddings (requires VOYAGE_API_KEY)

    # Vector store settings
    vector_store_type: "chromadb"
    vector_store_path: "data/projects"  # Vector stores live alongside crawled data

    # Retrieval settings
    default_k: 10                # number of chunks to retrieve per query

    # LLM settings
    llm_provider: "anthropic"
    llm_model: "claude-haiku-5-5"  # Fast and cheap for RAG
    # Effort controls how much the model thinks (thinking is on by default on Haiku 5.5).
    # low | medium | high | xhigh | max. Lower = cheaper/faster; low can skip tool calls
    # or stop early in long agent prompts.
    llm_effort: "medium"
    # Cache the system prompt + tool definitions (identical on every call) and the
    # growing tool-loop history. Cache reads cost 0.1x the input rate.
    llm_prompt_caching: true

  # Knowledge building (discover) settings
  knowledge_building:
    # Pages are read in consecutive windows of at most this many characters, each in
    # its own short LLM conversation, so a large page never sits in one call.
    window_chars: 6000
    # Safety cap on cost per page. Pages with more windows are only partly read;
    # this is logged, recorded in cache/discovery_state.json, and reported.
    max_windows_per_page: 25

  # Character discovery settings
  character_discovery:
    min_mentions: 3              # minimum chunks mentioning character to be discovered
    confidence_threshold: 0.7    # minimum confidence for character extraction

  # Cost tracking
  cost_tracking:
    enabled: true
    warn_threshold_usd: 5.0      # warn if costs exceed this amount
